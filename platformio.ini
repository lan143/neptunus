[env:kc868a6]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters =
    direct
    colorize
    esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
; Every dependency is pinned to an exact version or commit on purpose.
; A push to any unpinned repository silently changes the storage format and
; runtime behavior of a release build; a clean rebuild must never depend on
; library HEADs.
; Registry deps use @<version>; git deps use #<tag> or #<full-sha>
; (ed-config, ed-ha, ed-healthcheck and ed-network have no usable tags, so they
; are pinned by full commit SHA). FS is a built-in framework library and must
; stay bare.
; Note: the registry alias "ArduinoJSON" is spelled here with the canonical
; registry name "ArduinoJson", pinned at the same version.
lib_deps =
    ESP32Async/ESPAsyncWebServer@3.12.1
    ArduinoJson@7.4.3
    FS
    iarduino_Modbus@1.0.4
    https://github.com/lan143/ed-mqtt#0.1.1
    https://github.com/lan143/ed-config#47def1f1fd8df21900aad6af71bf81c4321b1dee
    https://github.com/lan143/ed-utils#0.3.0
    https://github.com/lan143/ed-ha#f6ca848b4189e6ce48470d73eb603f14bfc0837f
    https://github.com/lan143/ed-healthcheck#1ba83c3fef6634ddf0154663690e3e096f56c117
    https://github.com/lan143/ed-network#e6450b937e3cf24d06c4f720b00f246b10b01824
    https://github.com/lan143/ed-wb#0.1.1
    https://github.com/lan143/ed-common#0.8.1
    PCF8574@0.4.6
lib_ignore = RPAsyncTCP, ESPAsyncTCP
build_flags=
    -Wshadow
    -DCORE_DEBUG_LEVEL=5
    -DCONFIG_LOG_COLORS=1
    -DCONFIG_HEAP_POISONING_LIGHT=y

[env:kc868a6_ota]
extends = env:kc868a6
upload_protocol = espota
upload_port = 192.168.1.47
upload_flags = --auth=somestrongpassword 
